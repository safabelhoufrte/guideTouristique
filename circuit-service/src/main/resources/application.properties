spring.application.name=circuit-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8002}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guide_touristique}
spring.datasource.username=${DB_USERNAME:circuit}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/circuit
spring.flyway.default-schema=circuit
spring.flyway.schemas=circuit
spring.flyway.table=flyway_circuit_history
spring.flyway.clean-disabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
services.guide-url=${GUIDE_SERVICE_URL:http://localhost:8001}
