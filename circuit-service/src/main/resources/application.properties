spring.application.name=circuit-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/circuit_db}
spring.datasource.username=${DB_USER:circuit}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/circuit
spring.flyway.default-schema=circuit
spring.flyway.schemas=circuit
spring.flyway.table=flyway_circuit_history
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
services.guide-url=${GUIDE_SERVICE_URL:http://localhost:8081}
spring.jackson.deserialization.accept-float-as-int=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8180/realms/guide-touristique}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8180/realms/guide-touristique/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=guide-touristique-api
