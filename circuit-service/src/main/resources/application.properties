spring.application.name=circuit-service
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8092}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/circuit}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/circuit/schema.sql
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
services.guide-url=${GUIDE_SERVICE_URL:http://localhost:18081}
