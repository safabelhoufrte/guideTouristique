spring.application.name=reservation-service
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/tourisme_db}
spring.datasource.username=${DB_USER:reservation}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=reservation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/reservation
spring.flyway.default-schema=reservation
spring.flyway.schemas=reservation
spring.flyway.table=flyway_reservation_history
management.endpoints.web.exposure.include=health,info
services.circuit-url=${CIRCUIT_SERVICE_URL:http://localhost:8082}
services.guide-url=${GUIDE_SERVICE_URL:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8180/realms/guide-touristique}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8180/realms/guide-touristique/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=guide-touristique-api
