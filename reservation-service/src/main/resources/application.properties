spring.application.name=reservation-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservation_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration/reservation
spring.flyway.table=flyway_reservation_history
management.endpoints.web.exposure.include=health,info
services.circuit-url=${CIRCUIT_SERVICE_URL:http://localhost:8082}
services.guide-url=${GUIDE_SERVICE_URL:http://localhost:8081}