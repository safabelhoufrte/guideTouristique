spring.application.name=guide-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/tourisme_db}
spring.datasource.username=${DB_USER:guide}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=guide

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration/guide
spring.flyway.default-schema=guide
spring.flyway.schemas=guide
spring.flyway.table=flyway_guide_history
spring.flyway.clean-disabled=true

# Authentification Keycloak (realm guide-touristique), meme configuration que circuit-service.
# L'emetteur reste l'adresse vue par le navigateur ; dans Docker, les cles passent par keycloak:8080.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8180/realms/guide-touristique}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8180/realms/guide-touristique/protocol/openid-connect/certs}

# Photo upload (PUT /api/guides/me/photo): the service accepts up to 1.5 MB,
# so the multipart limit (1 MB by default) must be above it.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Frontend Angular
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}