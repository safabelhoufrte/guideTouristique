spring.application.name=guide-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/tourisme_db}
spring.datasource.username=${DB_USER:guide}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=guide

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration/guide
spring.flyway.default-schema=guide
spring.flyway.schemas=guide
spring.flyway.table=flyway_guide_history
spring.flyway.clean-disabled=true