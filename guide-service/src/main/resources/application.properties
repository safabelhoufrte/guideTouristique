spring.application.name=guide-service
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15433/tourisme_db}
spring.datasource.username=${DB_USER:guide}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=guide

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration/guide
spring.flyway.default-schema=guide
spring.flyway.schemas=guide
spring.flyway.table=flyway_guide_history
spring.flyway.clean-disabled=true

# Authentification temporaire HTTP Basic (le futur module Admin/JWT n'est pas encore integre)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}



# Authentification Guide
app.jwt.secret-base64=${APP_JWT_SECRET_BASE64}

# Frontend Angular
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Creation locale de comptes (developpement uniquement)
app.local-account.enabled=${APP_LOCAL_ACCOUNT_ENABLED:false}
app.local-account.guide-id=${APP_LOCAL_GUIDE_ID:0}
app.local-account.email=${APP_LOCAL_GUIDE_EMAIL:}
app.local-account.password=${APP_LOCAL_GUIDE_PASSWORD:}