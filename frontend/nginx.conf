server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/circuits {
        set $upstream http://circuit-service:8082;
        proxy_pass $upstream$request_uri;
    }
    location /api/guides {
        set $upstream http://guide-service:8081;
        proxy_pass $upstream$request_uri;
    }
    location /api/reservations {
        set $upstream http://reservation-service:8083;
        proxy_pass $upstream$request_uri;
    }
    location /api/avis {
        set $upstream http://avis-service:8084;
        proxy_pass $upstream$request_uri;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
